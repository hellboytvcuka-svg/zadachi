<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Задачи</title>
<meta name="theme-color" content="#07080b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Задачи">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;600;800;900&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--ink:#ECE8E1;--mut:#B3ADA3;--mut2:#8E887F;--acc:#D9C2A0;--onacc:#121212;--late:#E58C73;--line:rgba(255,255,255,.08);
  --q1:#E9B872;--q2:#E6DAC4;--q3:#8FA6BF;--q4:#77726B;--glass:rgba(20,20,22,.58);--gb:rgba(255,255,255,.12);--today:rgba(217,194,160,.10)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000}
body{display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Sans',sans-serif}
#app{width:430px;height:900px;max-height:100vh;border-radius:36px;overflow:hidden;position:relative;display:flex;flex-direction:column;color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.6);transition:background .4s}

@media (max-width:500px){body{display:block}#app{width:100%;height:100vh;height:100dvh;max-height:none;border-radius:0}}
@media (max-width:500px){header.top{padding-top:max(20px,env(safe-area-inset-top))}nav{margin-bottom:max(12px,env(safe-area-inset-bottom))!important}}
button,textarea{font:inherit;color:inherit;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
.glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--gb);border-radius:14px}
header.top{padding:20px 20px 10px;display:flex;align-items:flex-end;gap:10px}
.hd{flex:1;display:flex;flex-direction:column;gap:6px}
.date{font-size:13px;color:var(--mut)}
.pill{height:42px;width:42px;border-radius:21px;display:flex;align-items:center;justify-content:center}
h1{margin:0;font-family:Montserrat,sans-serif;font-weight:300;font-size:30px;letter-spacing:.14em;text-transform:uppercase}
main{flex:1;overflow-y:auto;padding:2px 12px 16px;scrollbar-width:none;position:relative}
main::-webkit-scrollbar{display:none}
nav{margin:0 8px 12px;height:64px;border-radius:24px!important;display:grid;grid-template-columns:repeat(6,1fr);flex:none}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;color:var(--mut2)}
nav button.on{color:var(--acc)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
svg{flex:none}
.lbl{font-family:Montserrat,sans-serif;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.meta{font-size:12px;color:var(--mut)}
.late{color:var(--late)}
.empty{font-size:12px;color:var(--mut2);padding:8px 4px}
.hint{margin:12px 4px 0;font-size:11.5px;color:var(--mut2);text-align:center}

/* цели/артефакты на каждой странице */
.ctx{display:flex;gap:8px;margin-bottom:10px}
.ctxb{flex:1;height:40px;border-radius:20px!important;display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px;color:var(--mut)}
.ctxb.on{color:var(--ink);border-color:var(--acc)!important}
.ctxp{padding:12px 14px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.mini{display:flex;flex-direction:column;gap:5px}
.mini .row{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.mini .row span:last-child{color:var(--mut)}
.bar{height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:4px;background:var(--acc)}

/* чат */
.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:6px}
.msg{max-width:84%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.4;white-space:pre-line}
.me{align-self:flex-end;background:var(--acc);color:var(--onacc);border-bottom-right-radius:6px}
.bot{align-self:flex-start;border-bottom-left-radius:6px!important}
.tcard{align-self:flex-start;width:86%;padding:12px 14px;display:flex;flex-direction:column;gap:7px;border-bottom-left-radius:6px!important}
.tcard .tt{font-size:15px;font-weight:500;line-height:1.3}
.tcard.isdone .tt{text-decoration:line-through;color:var(--mut2)}
.where{display:flex;align-items:center;gap:7px;font-size:13px;flex-wrap:wrap}
.linkb{color:var(--acc);font-size:13px;height:32px;text-align:left}
.cform{position:sticky;bottom:0;display:flex;align-items:flex-end;gap:8px;padding:6px 6px 6px 16px;border-radius:24px!important;margin-top:8px}
.cform textarea{flex:1;min-width:0;resize:none;outline:none;font-size:15px;line-height:1.35;padding:10px 0;max-height:140px;height:42px}
.cform textarea::placeholder{color:var(--mut2)}
.round{flex:none;width:44px;height:44px;border-radius:22px;background:var(--acc);color:var(--onacc);display:flex;align-items:center;justify-content:center}

/* матрица */
.matrix{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quad{padding:10px 8px 4px;display:flex;flex-direction:column;min-height:190px}
.quad.wide{grid-column:1/-1}
.qhead{display:flex;align-items:flex-start;gap:7px;padding:0 4px 8px;width:100%;text-align:left}
.qhead .dot{margin-top:4px}
.qhead h2{margin:0;font-family:Montserrat,sans-serif;font-weight:600;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;line-height:1.25}
.qhead small{display:block;font-size:11px;color:var(--mut);font-style:italic;margin-top:2px;letter-spacing:0;text-transform:none;font-family:'IBM Plex Sans',sans-serif;font-weight:400}
.qhead .n{margin-left:auto;font-size:12px;color:var(--mut)}
.mrow{display:flex;align-items:flex-start;border-top:1px solid var(--line)}
.chk{flex:none;width:30px;height:38px;display:flex;align-items:center;justify-content:center}
.chk span{width:17px;height:17px;border-radius:50%;border:1.5px solid rgba(236,232,225,.4);display:flex;align-items:center;justify-content:center}
.chk.done span{background:var(--acc);border-color:var(--acc)}
.mt{flex:1;min-width:0;text-align:left;padding:9px 2px 8px 0;display:flex;flex-direction:column;gap:3px}
.mt .tt{font-size:13px;line-height:1.28;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.isdone .tt{text-decoration:line-through;color:var(--mut2)}
.chips{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--mut)}
.pinned-ic{color:var(--acc)}
.more{font-size:12px;color:var(--acc);padding:10px 4px;text-align:left}

/* неделя */
.week{display:flex;flex-direction:column;gap:12px}
.day{overflow:hidden}
.day.today{background:var(--today);border-color:var(--acc)}
.day.blank{opacity:.5}
.dayrow{width:100%;display:flex;align-items:center;gap:14px;padding:0 14px 0 12px;height:60px;text-align:left}
.blank .dayrow{height:44px;cursor:default}
.dnum{width:40px;flex:none;font-family:Montserrat,sans-serif;font-weight:600;font-size:24px;text-align:center;line-height:1}
.blank .dnum{font-size:17px;font-weight:500}
.dname{flex:none;min-width:92px;display:flex;flex-direction:column;gap:2px}
.dname b{font-family:Montserrat,sans-serif;font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.dname small{font-size:11px;color:var(--mut)}
.dots{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.cnt{font-size:13px;color:var(--mut);min-width:14px;text-align:right}
.chev{transition:transform .2s;color:var(--mut)}
.open .chev{transform:rotate(180deg)}
.dlist{padding:0 14px 4px;border-top:1px solid var(--gb)}
.wrow{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line)}
.dlist .wrow:first-child{border-top:0}
.wrow .chk{width:38px;height:44px;margin-left:-8px}
.wrow .chk span{width:21px;height:21px}
.wt{flex:1;min-width:0;text-align:left;padding:10px 0;display:flex;flex-direction:column;gap:2px}
.wt .tt{font-size:15px;line-height:1.3}

/* календарь */
.calhead{display:flex;align-items:center;justify-content:space-between;padding:6px 4px}
.calhead b{font-family:Montserrat,sans-serif;font-weight:500;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.navb{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--mut)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:4px 6px 10px}
.wdn{font-size:11px;color:var(--mut2);text-align:center;padding:4px 0}
.cell{height:48px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:14px}
.cell.out{color:#5f5b56}
.cell.today{box-shadow:inset 0 0 0 1px var(--acc)}
.cell.sel{background:rgba(217,194,160,.2)}
.cdots{display:flex;gap:3px;height:5px}
.cdots i{width:5px;height:5px;border-radius:50%}
.sect{font-family:Montserrat,sans-serif;font-weight:500;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:16px 4px 8px}

/* цели, артефакты */
.glist{padding:16px 14px;display:flex;flex-direction:column;gap:14px;margin-bottom:10px}
.ghead{display:flex;justify-content:space-between;align-items:baseline}
.ghead h2{margin:0;font-family:Montserrat,sans-serif;font-weight:500;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.ghead span{font-size:12px;color:var(--mut);font-style:italic}
.rule{padding:14px 16px;border-left:3px solid var(--ink)!important;border-radius:10px;font-weight:600;font-size:14px;line-height:1.45;margin-bottom:10px}
.art{position:relative;overflow:hidden;padding:16px;display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.art .big{position:absolute;right:-14px;top:-10px;opacity:.08;pointer-events:none}
.art .top{position:relative;z-index:1}
.art h3{margin:0;font-family:Montserrat,sans-serif;font-weight:500;font-size:16px;letter-spacing:.1em;text-transform:uppercase}
.st-line{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mut)}
.st-line.on{color:var(--acc)}

/* шторка */
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:10;animation:fade .15s}
.sheet{width:100%;border-radius:22px 22px 0 0;padding:12px 16px 22px;background:rgba(26,25,23,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--gb);display:flex;flex-direction:column;gap:12px;animation:up .2s ease-out}
.grab{width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.22);align-self:center;margin-bottom:4px}
.stitle{font-size:20px;font-weight:500;line-height:1.3}
.primary{height:48px;border-radius:24px;background:var(--acc);color:var(--onacc);font-weight:600;font-size:15px;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.opt{min-height:44px;border-radius:22px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px;color:var(--mut);padding:0 8px;text-align:center}
.opt.on{border-color:var(--acc);color:var(--ink)}
.ghost{height:44px;color:var(--mut);font-size:13px;width:100%}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}

/* фокус только с клавиатуры */
button:focus,input:focus,select:focus,textarea:focus{outline:none}
button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* перетаскивание */
.mrow{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.mrow.dragsrc{opacity:.3}
.quad{transition:border-color .15s,background .15s}
.quad.drop{border-color:var(--acc);background:rgba(217,194,160,.14)}
.dopa .quad.drop{background:rgba(255,107,44,.16)}
.ghost-drag{position:absolute;z-index:30;pointer-events:none;padding:10px 14px;max-width:210px;font-size:13px;line-height:1.3;border-radius:12px;background:var(--glass);border:1px solid var(--acc);box-shadow:0 14px 34px rgba(0,0,0,.55);transform:rotate(-2deg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

/* формы */
.sheet{max-height:90%;overflow-y:auto;scrollbar-width:none}
.field{display:flex;flex-direction:column;gap:6px}
.inp{height:44px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--gb);color:var(--ink);padding:0 12px;font:inherit;font-size:15px;width:100%}
.inp:focus{border-color:var(--acc)}
textarea.inp{height:auto;min-height:64px;padding:10px 12px;resize:none}
select.inp{-webkit-appearance:none;appearance:none}
select.inp option{background:#1a1917;color:#ECE8E1}
.seg{display:grid;gap:6px}
.seg label{position:relative;display:block}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{min-height:44px;border-radius:22px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--mut);cursor:pointer;text-align:center;padding:0 6px}
.seg input:checked+span{border-color:var(--acc);color:var(--ink);background:rgba(217,194,160,.10)}
.seg input:focus-visible+span{outline:2px solid var(--acc)}
.photo{height:110px;border-radius:12px;border:1px dashed var(--gb);display:flex;align-items:center;justify-content:center;gap:8px;color:var(--mut);font-size:13px;background-size:cover;background-position:center;cursor:pointer;position:relative}
.photo.has span{background:rgba(0,0,0,.55);padding:4px 10px;border-radius:10px;color:#fff}
.photo input{position:absolute;opacity:0;width:1px;height:1px}
input[type=range]{width:100%;accent-color:var(--acc)}
.addbtn{width:100%;height:48px;border-radius:24px!important;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;color:var(--acc);margin-bottom:6px}
.goalrow{width:100%;text-align:left;display:flex;flex-direction:column;gap:6px;padding:4px 0}
.art .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.iconb{width:40px;height:40px;margin:-8px -8px -8px 0;display:flex;align-items:center;justify-content:center;color:var(--mut)}
.art.got{opacity:.6}
.art.hasimg{min-height:190px;justify-content:flex-end}
.small{height:44px;font-size:14px}

.grow{display:flex;align-items:flex-start;gap:4px}
.grow .chk{width:34px;height:40px;margin-left:-6px;flex:none}
.grow .chk span{width:20px;height:20px}
.grow .goalrow{flex:1;min-width:0}
.gdone .row span:first-child{text-decoration:line-through;color:var(--mut2)}
.donetag{color:var(--acc)}
.toast{position:absolute;left:16px;right:16px;top:100px;z-index:40;padding:14px 16px;border-radius:16px;background:var(--acc);color:var(--onacc);font-weight:600;font-size:14px;line-height:1.35;box-shadow:0 12px 30px rgba(0,0,0,.45);animation:up .25s ease-out}
.btnrow{display:flex;gap:8px}
.btnrow>*{flex:1}

.srctag{font-size:10px;padding:1px 6px;border-radius:6px;border:1px solid var(--gb);color:var(--mut)}

.addrow{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);padding:10px 4px;border-top:1px solid var(--line);width:100%;text-align:left;margin-top:auto}
.addrow svg{width:14px;height:14px}
.dayhead{display:flex;align-items:center}
.dayhead .dayrow{flex:1;min-width:0;padding-right:4px}
.dayadd{flex:none;width:44px;height:44px;margin-right:6px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:var(--mut)}
.dayadd:hover,.addrow:hover{color:var(--acc)}
.addpill{height:36px;padding:0 12px;border-radius:18px!important;display:flex;align-items:center;gap:6px;font-family:'IBM Plex Sans',sans-serif;font-size:12px;letter-spacing:0;text-transform:none;color:var(--acc)}
.addpill svg{width:14px;height:14px}

.gtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:24px!important;margin-bottom:6px}
.gtabs button{height:40px;border-radius:20px;font-size:13px;color:var(--mut)}
.gtabs button.on{background:var(--acc);color:var(--onacc);font-weight:600}
.gsubhead{margin:4px 6px 12px;font-size:13px;color:var(--mut);font-style:italic}
.gline{display:block;margin:-2px 0 2px 33px;font-size:12px;text-align:left}
.linkb.late{color:var(--late)}
.gkids{margin:2px 0 0 33px;padding-top:6px;border-top:1px solid var(--line);display:flex;flex-direction:column}
.gkid{display:flex;align-items:center;gap:8px;min-height:36px;text-align:left;width:100%}
.gkt{flex:1;min-width:0;font-size:13px}
.gdone-t{text-decoration:line-through;color:var(--mut2)}
.chipsel{display:flex;flex-wrap:wrap;gap:6px}
.chipsel .opt{min-height:36px;border-radius:18px;font-size:12px;padding:4px 12px}

.net{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:6px;vertical-align:middle;background:var(--mut2)}
.net-ok{background:#7FBF8A}.net-sync{background:var(--acc)}.net-off{background:var(--late)}
.login{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:24px 20px}
.login h1{margin-bottom:4px}

/* цели: карточки */
.gcard{padding:14px 14px 12px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px}
.lvl{font-family:Montserrat,sans-serif;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut2);font-weight:600}
.gsub{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:10px 12px 6px;display:flex;flex-direction:column;gap:2px}
.gmonths{margin-top:6px;padding-top:8px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:0}
.gi{display:flex;align-items:center;gap:4px;min-width:0}
.gi .chk{width:38px;height:44px;margin-left:-9px;flex:none}
.gi .chk span{width:21px;height:21px}
.gi-m .chk span{width:18px;height:18px}
.gbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;text-align:left;padding:8px 0}
.gtop{display:flex;justify-content:space-between;align-items:baseline;gap:10px;min-width:0}
.gt{min-width:0;font-size:14px;line-height:1.3}
.gi-y .gt{font-size:17px;font-weight:600}
.gi-q .gt{font-size:15px;font-weight:500}
.gpct{flex:none;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.gi-y .gpct{font-size:15px;color:var(--ink);font-weight:600}
.gi-m .bar,.gi-m .bar i{height:3px}
.gdone .gt{text-decoration:line-through;color:var(--mut2)}
.gdone .gpct{color:var(--acc)}

/* ===== ДОФАМИН (мягче) ===== */
#app.dopa{--ink:#FFF5EE;--mut:#D8BCAD;--mut2:#A5887A;--acc:#FF6B2C;--onacc:#1A0803;--late:#FF5A47;--line:rgba(255,140,90,.13);
  --q1:#FF4A3D;--q2:#FF9A3C;--q3:#F2C64E;--q4:#7D6E68;--glass:rgba(26,12,8,.72);--gb:rgba(255,130,80,.20);--today:rgba(255,107,44,.09)}
.dopa h1{font-weight:800;font-size:34px;letter-spacing:.05em}
.dopa .tt{font-weight:600!important}
.dopa .qhead h2,.dopa .dname b,.dopa .ghead h2,.dopa .art h3,.dopa .calhead b{font-weight:700}
.dopa .lbl,.dopa .sect{font-weight:600}
.dopa .dnum{font-weight:800}
.dopa .quad.q1{border-color:rgba(255,74,61,.55)}
.dopa .quad.q1 h2{color:var(--q1)}
.dopa .primary,.dopa .round{font-weight:700}
.dopa .chk span{border-color:rgba(255,245,238,.5)}
.dopa .bar{height:5px}.dopa .bar i{height:5px;background:linear-gradient(90deg,#FF4A3D,#FF9A3C)}
.dopa .sheet{background:rgba(28,13,9,.96)}
.dopa nav button.on{font-weight:700}
.dopa .cell.sel{background:rgba(255,107,44,.2)}
.dopa .rule{border-left-color:var(--acc)!important}
.dopa .seg input:checked+span{background:rgba(255,107,44,.12)}

function matchGoal(text){

  for(const g of AG()){
    const sc = goalScore(g, text);
    if(sc > bs || (sc === bs && sc > 0 && LV[g.level].ord > LV[best.level].ord)){ best = g; bs = sc; }

function findParent(title, level){
  const own = LV[level].ord; let best = null, bs = 0;
  for(const g of AG()){
    if(LV[g.level].ord >= own) continue;
    const sc = goalScore(g, title) + (LV[g.level].ord === own-1 ? .5 : 0);
    if(goalScore(g, title) > 0 && sc > bs){ best = g; bs = sc; }
  }
  if(best) return best;
  // запасной путь: похожая цель того же или нижнего уровня → берём её «родителя» нужного уровня
  let sib = null, ss = 0;
  for(const g of AG()){ const sc = goalScore(g, title); if(LV[g.level].ord >= own && sc > ss){ sib = g; ss = sc; } }
  let p = sib ? goalById(sib.parent) : null;
  while(p && LV[p.level].ord >= own) p = goalById(p.parent);
  return p || null;
}

// ===== разбор списка задач в «твоём» формате (одинаковый в приложении и в боте) =====
// сегодня:            → дата для следующих строк
// работа: / личка:    → раздел (тег)
// срочно и важно:     → квадрант для следующих строк (ИИ его не меняет)
// - задача ✅          → уже сделано, пропускаем
// «…, срочно и важно:» в конце строки → задача + новый заголовок
function lpNorm(s){ return String(s).toLowerCase().replace(/ё/g,'е').replace(/\s+/g,' ').trim(); }
function lpQuad(h){
  h = lpNorm(h);
  if(/не\s*срочн\S*,?\s*(и\s*)?не\s*важн|не\s*важн\S*,?\s*(и\s*)?не\s*срочн/.test(h)) return 4;
  if(/важн\S*,?\s*(но\s*)?не\s*срочн/.test(h)) return 2;
  if(/срочн\S*,?\s*(но\s*)?не\s*важн|делегир/.test(h)) return 3;
  if(/срочн\S*,?\s*(и\s*)?важн|важн\S*,?\s*(и\s*)?срочн/.test(h)) return 1;
  return 0;
}
const LP_WD = [[/понедельн/,1],[/вторник/,2],[/сред[ауы]/,3],[/четверг/,4],[/пятниц/,5],[/суббот/,6],[/воскресень/,0]];
function lpDate(h, todayISO, todayWd){
  h = lpNorm(h).replace(/^на\s+/,'').replace(/^в(о)?\s+/,'');
  const add = n => { const d = new Date(todayISO+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); };
  if(/^сегодня$/.test(h)) return add(0);
  if(/^послезавтра$/.test(h)) return add(2);
  if(/^завтра$/.test(h)) return add(1);
  const w = LP_WD.find(x => x[0].test(h) && h.split(' ').length <= 2);
  if(w){ let n = (w[1] - todayWd + 7) % 7; if(n === 0) n = 7; return add(n); }
  return null;
}
const LP_BULLET = /^\s*(?:[-–—•*·▪●]+|\d{1,2}[.)])\s*/;
const LP_DONE = /\s*(✅|✔️?|☑️?|\[x\])\s*$/i;
function parseList(text, todayISO, todayWd){
  // «1) а 2) б» в одной строке → отдельные строки
  const raw = String(text).replace(/\r/g,'').split('\n')
    .flatMap(l => l.split(/\s+(?=\d{1,2}[.)]\s)/))
    .flatMap(l => l.split(/;\s*/));
  const out = []; let q = 0, date = null, tag = '';
  const header = h => {
    const hq = lpQuad(h), hd = lpDate(h, todayISO, todayWd);
    if(hq){ q = hq; date = null; tag = ''; return true; }
    if(hd){ date = hd; return true; }
    const n = lpNorm(h);
    if(n && n.split(' ').length <= 3 && !/\d/.test(n)){ tag = n; return true; }
    return false;
  };
  for(let line of raw){
    let l = line.trim(); if(!l) continue;
    const isBullet = LP_BULLET.test(l);
    l = l.replace(LP_BULLET, '').trim(); if(!l) continue;
    // «задача, срочно и важно:» — задача + заголовок в конце
    const tail = l.match(/^(.*\S)\s*[,;]\s*([^,;:]{3,40}):\s*$/);
    if(tail && (lpQuad(tail[2]) || lpDate(tail[2], todayISO, todayWd))){
      pushItem(tail[1]); header(tail[2]); continue;
    }
    // «заголовок:» или «заголовок: задача»
    const hm = l.match(/^([^:]{2,40}):\s*(.*)$/);
    if(hm && !/^цель/.test(lpNorm(hm[1])) && (!isBullet || lpQuad(hm[1]) || lpDate(hm[1], todayISO, todayWd))){
      if(header(hm[1])){ if(hm[2].trim()) pushItem(hm[2]); continue; }
    }
    // строка без двоеточия, но целиком заголовок («срочно и важно», «сегодня»)
    if(!isBullet && (lpQuad(l) && lpNorm(l).split(' ').length <= 5 || lpDate(l, todayISO, todayWd))){ header(l); continue; }
    pushItem(l);
  }
  function pushItem(t){
    t = String(t).trim();
    const done = LP_DONE.test(t);
    t = t.replace(LP_DONE, '').replace(/\s+/g,' ').trim();
    if(!t) return;
    if(/^цель(\s|:|$)/i.test(t)){ out.push({kind:'goal', text:t}); return; }
    out.push({kind:'task', text:t, q, date, tag, done});
  }
  // одинаковые строки в одном сообщении — одна задача
  const seen = new Map();
  return out.filter(it => {
    if(it.kind !== 'task') return true;
    const k = lpNorm(it.text), prev = seen.get(k);
    if(prev){ if(it.q && !prev.q) prev.q = it.q; if(it.date && !prev.date) prev.date = it.date; prev.done = prev.done && it.done; return false; }
    seen.set(k, it); return true;
  });
}

const showDone = t => !t.done || doneMode() === 'all' || (doneMode() === 'recent' && doneAge(t) < DONE_DAYS*864e5);
const VT = () => (S.spf === 'all' ? S.tasks : S.tasks.filter(t => t.sp === S.spf)).filter(showDone);
const DM_LABEL = {recent:'за '+DONE_DAYS+' дня', hide:'скрыты', all:'все'};
function lateBar(){
  const n = S.tasks.filter(t => !t.done && t.date && diff(t.date) < 0 && (S.spf === 'all' || t.sp === S.spf)).length;
  return n ? '<div class="donebar latebar"><button data-a="latetoday">Просрочено: '+n+'<span class="dm-next">перенести все на сегодня</span></button></div>' : '';
}
function doneBar(list){
  const done = list.filter(t => t.done); if(!done.length) return '';
  const hidden = done.filter(t => !showDone(t)).length;
  return '<div class="donebar"><button data-a="donemode">✓ Сделанные: <b>'+DM_LABEL[doneMode()]+'</b>'+(hidden ? ' · скрыто '+hidden : '')+'<span class="dm-next">'+({recent:'скрыть все', hide:'показать все', all:'только '+DONE_DAYS+' дня'})[doneMode()]+'</span></button></div>';
}
function spBar(){
  const cnt = sp => S.tasks.filter(t => !t.done && (sp === 'all' || t.sp === sp)).length;
  return '<div class="spbar glass">'+[['all','Все'],['work','Работа'],['life','Личное']].map(([k,l]) =>
    '<button class="'+(S.spf===k?'on':'')+'" data-a="spf" data-v="'+k+'">'+(k!=='all'?'<span class="dot" style="background:'+SP[k].c+'"></span>':'')+l+' <span class="n">'+cnt(k)+'</span></button>').join('')+'</div>'+
    lateBar() + doneBar(S.spf === 'all' ? S.tasks : S.tasks.filter(t => t.sp === S.spf));
}
function chipsHtml(t){
  const c = chip(t.date); let out = '';
  if(t.pinned) out += '<span class="pinned-ic">'+I.pin+'</span>';
  out += spTag(t);
  if(t.src) out += '<span class="srctag">трекер</span>';
  if(c) out += '<span class="'+(c.late && !t.done ? 'late' : '')+'">'+h(c.text)+(t.time ? ' · '+(isCall(t)?'📞 ':'')+h(t.time) : '')+'</span>';
  return out ? '<span class="chips">'+out+'</span>' : '';
}
function chk(t){ return '<button class="chk '+(t.done?'done':'')+'" data-a="toggle" data-v="'+t.id+'" aria-label="Выполнено"><span>'+(t.done?I.check:'')+'</span></button>'; }
function bar(p){ return '<div class="bar"><i style="width:'+p+'%"></i></div>'; }
const field = (label, inner) => '<div class="field"><span class="lbl">'+label+'</span>'+inner+'</div>';
const seg = (name, opts, val) => '<div class="seg" style="grid-template-columns:repeat('+opts.length+',1fr)">'+opts.map(([v,l]) => '<label><input type="radio" name="'+name+'" value="'+v+'"'+(v===val?' checked':'')+'><span>'+l+'</span></label>').join('')+'</div>';
function artState(a){
  const g = goalById(a.gid);
  if(a.got) return {k:'got', text:'Получен', p:100};
  const p = a.unlock === 'goal' ? gp(g) : (a.opened ? 100 : 0);
  if(p >= 100) return {k:'open', text:'Открыт — можно забирать', p:100};
  return {k:'locked', text: a.unlock === 'goal' ? (g ? 'Откроется, когда цель будет на 100%' : 'Без привязки — откроешь сам') : 'Откроешь сам, когда решишь', p};
}
const priceTxt = a => { const n = String(a.price||'').replace(/\D/g,''); return n ? Number(n).toLocaleString('ru-RU')+' ₽' : ''; };

function ctxStrip(){
  let html = '<div class="ctx"><button class="ctxb glass '+(S.ctx==='goals'?'on':'')+'" data-a="ctx" data-v="goals">'+I.target16+'Цели</button>'+
    '<button class="ctxb glass '+(S.ctx==='art'?'on':'')+'" data-a="ctx" data-v="art">'+I.gem16+'Артефакты</button></div>';
  if(S.ctx === 'goals'){
    html += '<div class="ctxp glass">';
    ['month','q'].forEach(l => {
      const gs = AG().filter(g => g.level === l); if(!gs.length) return;
      html += '<span class="lbl">'+LV[l].name+' · '+PERIOD[l]+'</span>';
      gs.forEach(g => { const p = goalById(g.parent);
        html += '<button class="mini goalrow'+(g.done?' gdone':'')+'" data-a="goaledit" data-v="'+g.id+'"><div class="row"><span>'+h(g.t)+'</span><span>'+(g.done?'<span class="donetag">выполнена</span>':g.p+'%')+'</span></div>'+bar(gp(g))+(p?'<span class="meta">↳ '+h(goalLabel(p))+'</span>':'')+'</button>'; });
    });
    html += '</div>';
  }
  if(S.ctx === 'goals') html = html.replace(/<\/div>$/, '<button class="linkb" data-a="goalnew" data-v="month">+ Поставить цель</button></div>');
  if(S.ctx === 'art'){
    html += '<div class="ctxp glass"><span class="lbl">Ближайшие артефакты</span>';
    S.arts.filter(a => a.kind === 'near' && !a.got).forEach(a => { const st = artState(a);
      html += '<div class="mini"><div class="row"><span>'+h(a.t)+' <span class="meta">'+h(a.hint)+'</span></span><span>'+(st.k==='open'?'открыт':a.unlock==='manual'?'без привязки':st.p+'%')+'</span></div>'+(a.unlock==='manual'&&st.k!=='open'?'':bar(st.p))+'</div>'; });
    html += '</div>';
  }
  return html;
}

// ===== экраны =====
function goalCard(g){
  const chain = []; let p = goalById(g.parent);
  while(p){ chain.push(goalLabel(p)); p = goalById(p.parent); }
  const tip = g.level === 'year' ? 'Это верхний уровень. Дальше разбей её на цели на 3 месяца.'
    : g.level === 'q' ? 'Следующий шаг — цели месяца под эту цель.'
    : 'Задачи по этой теме буду привязывать к ней сам.';
  return '<div class="tcard glass"><span class="lbl">Новая цель · '+LV[g.level].name+' · '+PERIOD[g.level]+'</span><span class="tt">'+h(g.t)+'</span>'+
    (chain.length ? '<span class="meta">Входит в: '+h(chain.join(' → '))+'</span>' : '')+
    '<span class="meta" style="font-style:italic">'+tip+'</span>'+
    '<div style="display:flex;gap:16px"><button class="linkb" data-a="goaledit" data-v="'+g.id+'">Изменить</button><button class="linkb" style="color:var(--mut)" data-a="tab" data-v="goals">Все цели</button></div></div>';
}
function viewChat(){
  let html = ctxStrip();
  if(S.settings.lastReview !== curMonth() && TODAY.getDate() <= 10 && (S.goals.length || S.arts.length))
    html += '<div class="tcard glass" style="width:100%;margin-bottom:10px"><span class="lbl">Новый месяц</span><span class="tt">Пора разобрать '+MONF[TODAY.getMonth()].toLowerCase()+': артефакты и цели месяца</span><div class="btnrow"><button class="primary small" data-a="review">Начать</button><button class="opt" data-a="reviewlater">Не сейчас</button></div></div>';
  if(!S.chat.length) html += '<div class="msg bot glass" style="margin-bottom:10px">Привет! Пиши задачи как есть, можно сразу несколько строк. Я разложу их по матрице и привяжу к целям.\n\nЦели ставь так: «цель на месяц: …», «цель на 3 месяца: …», «цель на год: …».\n\nЕщё можно спросить: «что сегодня», «что просрочено».</div>';
  html += '<div class="chat">';
  for(const m of S.chat){
    if(m.from === 'me'){ html += '<div class="msg me">'+h(m.text)+'</div>'; continue; }
    if(m.text){ html += '<div class="msg bot glass">'+h(m.text)+'</div>'; continue; }
    if(m.batch){ html += batchCard(m); continue; }
    if(m.artq){ html += reviewArtCard(findArt(m.artq)); continue; }
    if(m.gstep){ html += reviewStepCard(m); continue; }
    if(m.goal){ const g = goalById(m.goal); html += g ? goalCard(g) : '<div class="msg bot glass" style="color:var(--mut)">Цель удалена</div>'; continue; }
    const t = find(m.task);
    if(!t){ html += '<div class="msg bot glass" style="color:var(--mut)">Задача удалена</div>'; continue; }
    const q = quad(t), c = chip(t.date);
    const where = [c ? c.text : 'без даты', t.time, tg(t)].filter(Boolean).join(' · ');
    html += '<div class="tcard glass '+(t.done?'isdone':'')+'"><span class="tt">'+h(t.t)+'</span>'+
      '<div class="where"><span class="dot" style="background:'+qc(q)+'"></span><b style="font-weight:600">'+Q[q].label+'</b></div>'+
      '<span class="meta '+(c&&c.late&&!t.done?'late':'')+'">'+spTag(t)+h(where)+'</span>'+(t.done ? '' : callLine(t));
    if(S.editIn === t.id){
      html += '<div class="grid2" style="margin-top:4px">'+[1,2,3,4].map(n => '<button class="opt '+(n===q?'on':'')+'" data-a="setq" data-v="'+t.id+':'+n+'" data-closeedit="1"><span class="dot" style="background:'+qc(n)+'"></span>'+Q[n].label+'</button>').join('')+'</div>';
    } else {
      html += '<div style="display:flex;gap:16px"><button class="linkb" data-a="editin" data-v="'+t.id+'">Изменить</button><button class="linkb" style="color:var(--mut)" data-a="open" data-v="'+t.id+'">Подробнее</button></div>';
    }
    html += '</div>';
  }
  html += '</div><form class="cform glass" id="cf"><label for="ci" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Сообщение</label><textarea id="ci" rows="1" placeholder="Задачи — можно списком"></textarea><button class="round" type="submit" aria-label="Отправить">'+I.send+'</button></form>';
  return html;
}

function viewMatrix(){
  let html = ctxStrip() + spBar() + '<div class="matrix">';
  for(const n of [1,2,3,4]){
    const list = VT().filter(t => quad(t) === n).sort(byRank);
    const open = S.expandedQ === n;
    const shown = list;
    const left = list.filter(t => !t.done).length;
    html += '<section class="quad q'+n+' glass '+(open?'wide':'')+'" data-q="'+n+'">';
    html += '<button class="qhead" data-a="more" data-v="'+n+'"><span class="dot" style="background:'+qc(n)+'"></span><h2>'+Q[n].label+'<small>'+Q[n].sub+'</small></h2><span class="n">'+left+'</span></button>';
    if(!list.length) html += '<div class="empty">Перетащи сюда</div>';
    // все задачи сразу — список листается внутри квадранта, без «Ещё»
    if(list.length) html += '<div class="qlist'+(list.length > 5 ? ' long' : '')+'">'+shown.map(t => '<div class="mrow '+(t.done?'isdone':'')+'" data-id="'+t.id+'">'+chk(t)+'<button class="mt" data-a="open" data-v="'+t.id+'"><span class="tt">'+h(t.t)+'</span>'+chipsHtml(t)+'</button></div>').join('')+'</div>';
    html += '<button class="addrow" data-a="addtask" data-v="q'+n+'">'+I.plus+'Добавить</button>';
    html += '</section>';
  }
  return html + '</div><p class="hint">Перетащи задачу в другой квадрант (на телефоне — зажми и тяни). Тап — подробности.</p>';
}

function dayBlock(key, num, name, sub, list, kind){
  list = list.slice().sort((a,b) => (a.done-b.done) || (quad(a)-quad(b)) || String(a.time||'99').localeCompare(String(b.time||'99')));
  const blank = !list.length;
  const open = !blank && S.open.has(key);
  const left = list.filter(t => !t.done).length;
  const cls = ['day','glass', open?'open':'', blank?'blank':'', kind==='today'?'today':''].join(' ');
  let html = '<section class="'+cls+'">';
  const addV = key === 'none' ? 'd' : key.startsWith('d') ? 'd'+addD(+key.slice(1)) : '';
  html += '<div class="dayhead">';
  html += '<button class="dayrow" '+(blank?(addV?'data-a="addtask" data-v="'+addV+'"':'disabled'):'data-a="day" data-v="'+key+'"')+'>'+
    '<span class="dnum '+(kind==='late'?'late':'')+'">'+num+'</span>'+
    '<span class="dname"><b class="'+(kind==='late'?'late':'')+'">'+h(name)+'</b>'+(sub?'<small>'+h(sub)+'</small>':'')+'</span>'+
    '<span class="dots">'+list.map(t => '<i class="dot" style="background:'+qc(quad(t))+';opacity:'+(t.done?.3:1)+'"></i>').join('')+'</span>'+
    (blank ? '<span class="meta">свободно</span>' : '<span class="cnt">'+left+'</span>'+I.chev)+'</button>'+
    (addV ? '<button class="dayadd" data-a="addtask" data-v="'+addV+'" aria-label="Добавить задачу на '+h(name)+'">'+I.plus+'</button>' : '')+'</div>';
  if(open){
    html += '<div class="dlist">';
    for(const t of list){
      const meta = [(t.time && isCall(t) ? '📞 ' : '')+(t.time||''), kind==='late' ? chip(t.date).text : '', tg(t)].filter(Boolean).join(' · ');
      html += '<div class="wrow '+(t.done?'isdone':'')+'">'+chk(t)+'<button class="wt" data-a="open" data-v="'+t.id+'"><span class="tt">'+h(t.t)+'</span>'+(meta||t.sp?'<span class="meta">'+spTag(t)+h(meta)+'</span>':'')+'</button><span class="dot" style="background:'+qc(quad(t))+'"></span></div>';
    }
    html += '</div>';
  }
  return html + '</section>';
}
function viewWeek(){
  let html = ctxStrip() + spBar() + '<div class="week">';
  const late = VT().filter(t => t.date && diff(t.date) < 0 && !t.done);
  if(late.length) html += dayBlock('late', I.alert, 'Просрочено', '', late, 'late');
  for(let i=0;i<7;i++){
    const d = addD(i), dt = pd(d);
    const name = i===0 ? 'Сегодня' : i===1 ? 'Завтра' : WDF[dt.getDay()];
    const sub = (i<2 ? WDF[dt.getDay()].toLowerCase()+', ' : '') + dt.getDate()+' '+MON[dt.getMonth()];
    html += dayBlock('d'+i, dt.getDate(), name, sub, VT().filter(t => t.date === d), i===0?'today':'');
  }
  html += dayBlock('none','—','Без даты','',VT().filter(t => !t.date),'');
  return html + '</div>';
}

function viewCal(){
  const {y,m} = S.cal;
  const first = new Date(y,m,1), off = (first.getDay()+6)%7;
  const dim = new Date(y,m+1,0).getDate();
  const cells = Math.ceil((off+dim)/7)*7;
  let html = ctxStrip() + spBar() + '<div class="glass"><div class="calhead"><button class="navb" data-a="calprev" aria-label="Предыдущий месяц">'+I.left+'</button><b>'+MONF[m]+' '+y+'</b><button class="navb" data-a="calnext" aria-label="Следующий месяц">'+I.right+'</button></div><div class="cal">';
  ['пн','вт','ср','чт','пт','сб','вс'].forEach(w => html += '<div class="wdn">'+w+'</div>');
  for(let i=0;i<cells;i++){
    const d = new Date(y,m,1-off+i), k = iso(d);
    const ts = VT().filter(t => t.date === k);
    const cls = ['cell', d.getMonth()!==m?'out':'', k===iso(TODAY)?'today':'', k===S.sel?'sel':''].join(' ');
    html += '<button class="'+cls+'" data-a="sel" data-v="'+k+'"><span>'+d.getDate()+'</span><span class="cdots">'+
      ts.slice(0,4).map(t => '<i style="background:'+qc(quad(t))+';opacity:'+(t.done?.3:1)+'"></i>').join('')+'</span></button>';
  }
  html += '</div></div>';
  const sd = pd(S.sel);
  const list = VT().filter(t => t.date === S.sel).sort((a,b) => (a.done-b.done)||(quad(a)-quad(b)));
  html += '<div class="sect" style="display:flex;align-items:center;justify-content:space-between">'+WDF[sd.getDay()]+', '+sd.getDate()+' '+MON[sd.getMonth()]+'<button class="addpill glass" data-a="addtask" data-v="d'+S.sel+'">'+I.plus+'Задача</button></div><div class="glass" style="padding:0 14px">';
  if(!list.length) html += '<div class="empty" style="padding:14px 0">Свободный день</div>';
  list.forEach((t,i) => {
    const meta = [(t.time && isCall(t) ? '📞 ' : '')+(t.time||''), tg(t)].filter(Boolean).join(' · ');
    html += '<div class="wrow '+(t.done?'isdone':'')+'" style="'+(i===0?'border-top:0':'')+'">'+chk(t)+'<button class="wt" data-a="open" data-v="'+t.id+'"><span class="tt">'+h(t.t)+'</span>'+(meta||t.sp?'<span class="meta">'+spTag(t)+h(meta)+'</span>':'')+'</button><span class="dot" style="background:'+qc(quad(t))+'"></span></div>';
  });
  return html + '</div>';
}

function gItem(g, size){
  return '<div class="gi gi-'+size+(g.done?' gdone':'')+'">'+
    '<button class="chk '+(g.done?'done':'')+'" data-a="goaldone" data-v="'+g.id+'" aria-label="'+(g.done?'Вернуть цель в работу':'Отметить цель выполненной')+'"><span>'+(g.done?I.check:'')+'</span></button>'+
    '<button class="gbody" data-a="goaledit" data-v="'+g.id+'"><span class="gtop"><span class="gt">'+h(g.t)+'</span><span class="gpct">'+(g.done?'готово':gp(g)+'%')+'</span></span>'+bar(gp(g))+'</button></div>';
}
function monthsBlock(list, cls){
  if(!list.length) return '';
  return '<div class="'+cls+'"><span class="lvl">Месяц · '+PERIOD.month+'</span>'+list.map(m => gItem(m,'m')).join('')+'</div>';
}
function quarterBlock(q){
  const mm = S.goals.filter(g => g.parent === q.id && g.level === 'month');
  return '<div class="gsub"><span class="lvl">Квартал · '+PERIOD.q+'</span>'+gItem(q,'q')+monthsBlock(mm,'gmonths')+'</div>';
}
const GTABS = [['month','Этот месяц'],['q','3 месяца'],['year','Год']];
const QMON = (() => { const m0 = QN*3; return MON[m0]+' — '+MON[m0+2]; })();
const GSUB = {month: MONF[TODAY.getMonth()]+' '+TODAY.getFullYear(), q: QMON+' '+TODAY.getFullYear(), year: 'весь '+TODAY.getFullYear()+' год'};
const GADD = {month:'Цель на месяц', q:'Цель на 3 месяца', year:'Цель на год'};
function viewSf(){
  const sp = S.sf || 'work';
  const all = S.tasks.filter(t => t.sp === sp), list = all.filter(showDone);
  const cnt = k => S.tasks.filter(t => t.sp === k && !t.done).length;
  const col = (imp, label) => {
    const l = list.filter(t => !!t.imp === imp).sort((a,b) => (a.done-b.done) || byRank(a,b));
    return '<section class="quad sfcol glass" data-imp="'+(imp?1:0)+'"><div class="qhead"><span class="dot" style="background:'+(imp?'var(--acc)':'var(--mut2)')+'"></span><h2>'+label+'</h2><span class="n">'+l.filter(t=>!t.done).length+'</span></div>'+
      (l.length ? '' : '<div class="empty">Перетащи сюда</div>')+
      l.map(t => '<div class="mrow '+(t.done?'isdone':'')+'" data-id="'+t.id+'">'+chk(t)+'<button class="mt" data-a="open" data-v="'+t.id+'"><span class="tt">'+h(t.t)+'</span>'+chipsHtml(Object.assign({}, t, {sp:''}))+'</button></div>').join('')+
      '<button class="addrow" data-a="addtask" data-v="s'+sp+(imp?1:0)+'">'+I.plus+'Добавить</button></section>';
  };
  const none = S.tasks.filter(t => !t.sp && !t.done);
  return '<div class="sfseg glass">'+['work','life'].map(k => '<button class="'+(sp===k?'on':'')+'" data-a="sf" data-v="'+k+'"><span class="dot" style="background:'+SP[k].c+'"></span>'+SP[k].label+' <span class="n">'+cnt(k)+'</span></button>').join('')+'</div>'+doneBar(all)+
    '<div class="matrix">'+col(true,'Важно')+col(false,'Не важно')+'</div>'+
    '<p class="hint">Перетащи задачу в другую колонку — в Матрице она тоже станет важной или неважной.</p>'+
    (none.length ? '<div class="sect" style="display:flex;justify-content:space-between"><span>Без раздела</span><span>'+none.length+'</span></div><div class="glass sfinbox">'+
      none.map(t => '<div class="sfirow"><button class="sft" data-a="open" data-v="'+t.id+'">'+h(t.t)+'</button><button class="sfpick" data-a="setsp" data-v="'+t.id+':work"><span class="dot" style="background:var(--work)"></span>Работа</button><button class="sfpick" data-a="setsp" data-v="'+t.id+':life"><span class="dot" style="background:var(--life)"></span>Личное</button></div>').join('')+'</div>' : '');
}
function viewGoals(){
  const lv = S.gtab || 'month';
  let html = '<div class="gtabs glass">'+GTABS.map(([k,l]) => '<button class="'+(k===lv?'on':'')+'" data-a="gtab" data-v="'+k+'">'+l+'</button>').join('')+'</div>'+
    '<p class="gsubhead">'+GSUB[lv]+'</p>';
  ensurePer();
  const all = S.goals.filter(g => g.level === lv && isActive(g)).sort((a,b) => (a.done-b.done));
  const groups = [[true,'Важно'],[false,'Не важно']];
  const card = g => {
    const p = goalById(g.parent);
    const kids = S.goals.filter(x => x.parent === g.id);
    html += '<section class="gcard glass">'+gItem(g, 'y');
    if(lv !== 'year' && p) html += '<span class="meta gline">Ведёт к: '+h(goalLabel(p))+'</span>';
    if(kids.length) html += '<div class="gkids">'+kids.map(k => '<button class="gkid" data-a="goaledit" data-v="'+k.id+'"><span class="dot" style="background:'+(k.done?'var(--acc)':'var(--mut2)')+'"></span><span class="gkt'+(k.done?' gdone-t':'')+'">'+h(k.t)+'</span><span class="meta">'+LV[k.level].short+' · '+gp(k)+'%</span></button>').join('')+'</div>';
    else if(lv !== 'month') html += '<button class="linkb gline" data-a="goalnew" data-v="'+(lv==='year'?'q':'month')+':'+g.id+'">+ Разбить на шаги ('+(lv==='year'?'цели на 3 месяца':'цели месяца')+')</button>';

function goalArchive(lv){
  const past = S.goals.filter(g => g.level === lv && g.per && g.per !== curPer(lv));

['click','submit','change'].forEach(ev => document.addEventListener(ev, () => { lastUI = Date.now(); }, true));
const typingNow = () => { const ae = document.activeElement; return ae && app.contains(ae) && (ae.tagName === 'TEXTAREA' || (ae.tagName === 'INPUT' && /^(text|search|url|email|number|)$/.test(ae.type))); };
document.addEventListener('focusout', () => setTimeout(() => { if(pendingRender && !typingNow()){ pendingRender = false; render(true); } }, 80), true);

  { const nsh = app.querySelector('.sheet'); if(nsh){ nsh.dataset.k = shKey; if(shWas === shKey && shTop) nsh.scrollTop = shTop; } }
  { const tt = document.getElementById('ttitle'); if(tt){ const fit = () => { tt.style.height = 'auto'; tt.style.height = tt.scrollHeight+'px'; }; fit(); tt.addEventListener('input', fit); tt.addEventListener('keydown', e => { if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); tt.blur(); } }); } }
  afterRender();

// ===== чат-логика =====
function listMsg(title, list){
  if(!list.length) return title+': ничего нет.';
  return title+':\n'+list.map(t => '• '+t.t+(t.time?' — '+t.time:'')).join('\n');
}
function send(text){
  pushChat({from:'me', text});
  const s = norm(text.trim());
  if(/^(что|покажи|план)?\s*(у меня\s*)?(на\s*)?сегодня\??$/.test(s)){
    const l = S.tasks.filter(t => t.date === addD(0) && !t.done).sort((a,b)=>quad(a)-quad(b));
    pushChat({from:'bot', text:listMsg('Сегодня', l)}); return;
  }
  if(/^(что\s*)?(у меня\s*)?просроч/.test(s)){
    const l = S.tasks.filter(t => t.date && diff(t.date) < 0 && !t.done);
    pushChat({from:'bot', text:listMsg('Просрочено', l)}); return;
  }
  const forAi = [], made = [];
  let skippedDone = 0, existed = 0;
  const openTexts = new Set(S.tasks.filter(t => !t.done).map(t => lpNorm(t.t)));
  parseList(text, iso(TODAY), TODAY.getDay()).forEach(it => {
    if(it.kind === 'goal'){
      const g = goalFromText(it.text);
      pushChat(g ? {from:'bot', goal:g.id} : {from:'bot', text:'Напиши после «цель» саму цель, например: «цель на 3 месяца: запустить сайт студии».'});
      if(g) forAi.push({kind:'goal', id:g.id, text:g.t, level:g.level});
      return;
    }
    if(it.done){ skippedDone++; return; }
    if(openTexts.has(lpNorm(it.text))){ existed++; return; }
    const auto = parse(it.text);
    const t = T(it.text[0].toUpperCase()+it.text.slice(1), auto);
    if(it.date){ t.date = it.date; if(!it.q) t.imp = true; }
    if(it.tag){ t.tag = it.tag; t.sp = spFromTag(it.tag); }
    if(!t.sp){ const k = spByKw(it.text, S.settings.spKw); if(k){ t.sp = k; t.spk = 1; } }
    if(!t.sp && S.spf !== 'all') t.sp = S.spf;
    if(it.q){ setQ(t, it.q); delete t.manual; t.qfix = 1; }
    S.tasks.push(t); made.push(t); openTexts.add(lpNorm(it.text));
    forAi.push({kind:'task', id:t.id, text:it.text});
  });
  if(made.length > 3) pushChat({from:'bot', batch: made.map(t => t.id)});
  else made.forEach(t => pushChat({from:'bot', task:t.id}));
  const notes = [];
  if(skippedDone) notes.push('уже выполненных (✅) пропустил: '+skippedDone);
  if(existed) notes.push('уже были в списке: '+existed);
  if(notes.length) pushChat({from:'bot', text: notes.join('\n')});
  if(forAi.length) aiRefine(forAi);
  autoAlarm(made);
}

  }

let drag = null;
app.addEventListener('pointerdown', e => {
  if(e.button > 0) return;
  const row = e.target.closest('.mrow'); if(!row || e.target.closest('.chk')) return;
  drag = {id:row.dataset.id, row, sx:e.clientX, sy:e.clientY, x:e.clientX, y:e.clientY, active:false, touch:e.pointerType !== 'mouse'};
  if(drag.touch) drag.timer = setTimeout(() => { if(drag && !drag.active) startDrag(); }, 300);
});
function startDrag(){
  drag.active = true; drag.row.classList.add('dragsrc');
  const gh = document.createElement('div'); gh.className = 'ghost-drag'; gh.textContent = find(drag.id).t;
  app.appendChild(gh); drag.gh = gh;
  if(navigator.vibrate) navigator.vibrate(12);
  moveDrag(drag.x, drag.y);
}
function moveDrag(x, y){
  const r = app.getBoundingClientRect();
  drag.gh.style.left = (x - r.left - 40)+'px'; drag.gh.style.top = (y - r.top - 34)+'px';
  const el = document.elementFromPoint(x, y), q = el && el.closest('.quad');
  drag.imp = q && q.dataset.imp !== undefined ? q.dataset.imp === '1' : null;
  app.querySelectorAll('.quad.drop').forEach(n => { if(n !== q) n.classList.remove('drop'); });
  if(q) q.classList.add('drop');
  drag.q = q ? +q.dataset.q : null;
  const main = app.querySelector('main'), mr = main.getBoundingClientRect();
  if(y < mr.top + 50) main.scrollTop -= 10; else if(y > mr.bottom - 50) main.scrollTop += 10;
}
document.addEventListener('pointermove', e => {
  if(!drag) return;
  drag.x = e.clientX; drag.y = e.clientY;
  if(!drag.active){
    const dist = Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy);
    if(drag.touch){ if(dist > 10){ clearTimeout(drag.timer); drag = null; } return; }
    if(dist > 6) startDrag(); else return;
  }
  moveDrag(e.clientX, e.clientY);
});
document.addEventListener('touchmove', e => { if(drag && drag.active) e.preventDefault(); }, {passive:false});
function endDrag(drop){
  if(!drag) return;
  clearTimeout(drag.timer);
  if(drag.active){
    dragEnd = Date.now(); drag.gh.remove();
    const t = find(drag.id);
    if(drop && t && drag.imp !== null && drag.imp !== undefined && drag.imp !== !!t.imp){ const u = quad(t) === 1 || quad(t) === 3; setQ(t, drag.imp ? (u ? 1 : 2) : (u ? 3 : 4)); }
    else if(drop && drag.q && t && drag.q !== quad(t)) setQ(t, drag.q);
    drag = null; render(true); return;
  }
  drag = null;
}
document.addEventListener('pointerup', () => endDrag(true));
document.addEventListener('pointercancel', () => endDrag(false));

const curMonth = () => TODAY.getFullYear()+'-'+String(TODAY.getMonth()+1).padStart(2,'0');
function startReview(){
  S.tab = 'chat'; S.scrollChat = true; S.settings.lastReview = curMonth();
  const arts = S.arts.filter(a => !a.got);
  const qs = AG().filter(g => g.level === 'q' && !g.done && !AG().some(x => x.parent === g.id && x.level === 'month'));
  pushChat({from:'bot', text:'Разбор месяца: '+MONF[TODAY.getMonth()].toLowerCase()+'.\n\nСначала артефакты. Ты сам решаешь, после какой цели разрешаешь себе покупку. Я только спрашиваю и напоминаю. Выбери цель для каждого или оставь «Без привязки».'});
  arts.forEach(a => pushChat({from:'bot', artq:a.id}));
  if(qs.length){
    pushChat({from:'bot', text:'Теперь цели. У этих целей на 3 месяца нет шага на этот месяц. Предлагаю варианты — возьми подходящий в один тап или напиши свой.'});
    qs.forEach(g => { const m = pushChat({from:'bot', gstep:g.id}); aiSteps(m, g); });
  }
  if(!arts.length && !qs.length) pushChat({from:'bot', text:'Артефактов и целей для разбора пока нет. Добавь цели на 3 месяца — и в следующий раз я помогу разбить их на шаги.'});
  pushChat({from:'bot', text:'Готово. В начале следующего месяца спрошу снова.'});

// подсказки шагов на месяц (в рабочей версии формулирует ИИ по целям и задачам)
function stepSuggest(g){
  const out = [];

  const target = Math.min(100, Math.ceil((gp(g)+30)/10)*10);

const cardQuad = title => { const n = norm(title); return /срочно и важно/.test(n) ? 1 : /важно,? но не срочно|важно,? не срочно/.test(n) ? 2 : /срочно,? но не важно|делег/.test(n) ? 3 : /не срочно,? не важно/.test(n) ? 4 : 0; };
const plural = (n, a, b, c) => { n = Math.abs(n) % 100; const k = n % 10; return n > 10 && n < 20 ? c : k > 1 && k < 5 ? b : k === 1 ? a : c; };
async function syncTracker(manual){
  const tr = S.tracker, st = S.settings;
  if(!st.trOn || tr.busy) return;
  tr.busy = true; if(manual) render(true);
  try{
    const data = await api('/tracker');
    tr.available = (data.cols || []).map(c => c.name);
    const fresh = [];
    for(const col of data.cols || []){
      if(!st.trCols.includes(col.name)) continue;
      for(const card of col.cards || []){
        const q = cardQuad(card.title);
        for(const it of card.items || []){
          const src = 'tr_'+it.id, done = !!it.done;
          const ex = S.tasks.find(t => t.src === src);
          if(ex){ if(!ex.tEd) ex.t = it.text; if(!ex.dEd) ex.date = it.deadline || null; ex.done = done; continue; } // правки руками трекер не перетирает
          if(done || st.trIgnored.includes(src) || S.tomb.tasks.some(x => x.src === src)) continue;
          const auto = parse(it.text);
          const t = T(it.text, Object.assign(auto, {date: it.deadline || auto.date, src, col: col.name, from: col.name+' · '+card.title}));
          if(q) setQ(t, q);
          t.sp = 'work';
          S.tasks.push(t); fresh.push(t);
        }
      }
    }
    tr.status = 'подключён'; tr.last = new Date().toTimeString().slice(0,5);
    if(fresh.length){
      pushChat({from:'bot', text:'Из трекера пришло новых задач: '+fresh.length});
      fresh.forEach(t => pushChat({from:'bot', task:t.id}));
      S.scrollChat = true;
      toast('Из трекера: +'+fresh.length+' '+plural(fresh.length,'задача','задачи','задач'));
    } else if(manual) toast('Трекер синхронизирован, новых задач нет');
  } catch(e){
    tr.status = e.message === 'no_tracker' ? 'на сервере не настроен трекер' : 'ошибка: '+e.message;
  }
  tr.busy = false; render(true);
}

  });
}

const API_DEFAULT = '';   // ← сюда можно вписать адрес сервера, чтобы не вводить его при входе
const NETT = {local:'только на устройстве', sync:'сохраняю…', ok:'всё сохранено', off:'нет связи — сохранено на устройстве'};
const AUTH = {url: localStorage.getItem('zd_api') || API_DEFAULT, pass: localStorage.getItem('zd_pass') || ''};
async function api(path, opts = {}){
  const r = await fetch(AUTH.url.replace(/\/+$/,'') + path, {
    method: opts.method || 'GET',
    headers: {'Authorization': 'Bearer '+AUTH.pass, 'Content-Type': 'application/json'},
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  const data = await r.json().catch(() => ({}));
  if(r.status === 401) throw new Error('неверный пароль');
  if(!r.ok) throw new Error(data.error || ('ошибка '+r.status));
  return data;
}
function pushChat(m){
  const now = Date.now();
  const last = S.chat.length ? S.chat[S.chat.length-1].ts || 0 : 0;
  m.id = uid('m'); m.ts = Math.max(now, last + 1);
  S.chat.push(m);
  return m;
}
const KINDS = ['tasks','goals','arts','chat'];
let SNAP = {}, SNAPK = {};
const strip = o => { const c = Object.assign({}, o); delete c.u; return JSON.stringify(c); };
function resetSnap(){
  SNAP = {}; SNAPK = {};
  for(const k of KINDS) for(const it of S[k]){ SNAP[it.id] = strip(it); SNAPK[it.id] = k; }
  SNAP.__settings = strip(S.settings);
}
function stamp(){
  const now = Date.now(); let changed = false;
  for(const k of KINDS){
    const seen = new Set();
    for(const it of S[k]){
      seen.add(it.id);
      const j = strip(it);
      if(SNAP[it.id] !== j){ it.u = now; SNAP[it.id] = j; SNAPK[it.id] = k; changed = true; }
    }
    for(const id in SNAPK){
      if(SNAPK[id] === k && !seen.has(id)){
        const old = JSON.parse(SNAP[id] || '{}');
        S.tomb[k].push({id, del:1, u:now, src: old.src || undefined});
        delete SNAP[id]; delete SNAPK[id]; changed = true;
      }
    }
  }
  const sj = strip(S.settings);
  if(SNAP.__settings !== sj){ S.settings.u = now; SNAP.__settings = sj; changed = true; }
  return changed;
}
function saveLocal(){
  try{ localStorage.setItem('zd_data', JSON.stringify({tasks:S.tasks, goals:S.goals, arts:S.arts, chat:S.chat.slice(-300), settings:S.settings, tomb:S.tomb})); }
  catch(e){ console.warn('local save failed', e); }
}
function loadLocal(){
  try{
    const d = JSON.parse(localStorage.getItem('zd_data') || 'null');
    if(!d) return;
    for(const k of KINDS) S[k] = (d[k] || []).filter(x => !x.del);
    if(d.settings) S.settings = Object.assign(S.settings, d.settings);
    if(d.tomb) S.tomb = Object.assign({tasks:[], goals:[], arts:[], chat:[]}, d.tomb);
  } catch(e){}
}
function mergeList(a = [], b = []){
  const m = new Map();
  for(const x of [...a, ...b]){ if(!x || !x.id) continue; const p = m.get(x.id); if(!p || (x.u||0) >= (p.u||0)) m.set(x.id, x); }
  return [...m.values()];
}
let syncTimer = null, syncing = false, syncAgain = false;
function scheduleSync(ms = 1200){ clearTimeout(syncTimer); syncTimer = setTimeout(sync, ms); }
async function sync(){
  if(!AUTH.pass) return;
  if(syncing){ syncAgain = true; return; }
  syncing = true; S.net = 'sync'; paintNet();
  const started = Date.now();
  try{
    const payload = {settings: S.settings};
    for(const k of KINDS) payload[k] = S[k].concat(S.tomb[k]);
    const srv = await api('/sync', {method:'POST', body: payload});
    let dirty = false;
    for(const k of KINDS){
      const merged = mergeList(srv[k] || [], S[k].concat(S.tomb[k]));
      S[k] = merged.filter(x => !x.del);
      S.tomb[k] = S.tomb[k].filter(x => (x.u||0) > started);
      if(S[k].some(x => (x.u||0) > started) || S.tomb[k].length) dirty = true;
    }
    S.chat.sort((a,b) => (a.ts||0) - (b.ts||0));
    if(srv.settings && (srv.settings.u||0) > (S.settings.u||0)) S.settings = Object.assign(S.settings, srv.settings);
    resetSnap(); saveLocal();
    if(dedupeTracker() && stamp()){ saveLocal(); dirty = true; }
    S.net = 'ok';
    if(dirty) syncAgain = true;
    renderKeep();
  } catch(e){
    S.net = e.message === 'неверный пароль' ? 'off' : 'off';
    if(e.message === 'неверный пароль'){ logout(); }
  }
  syncing = false; paintNet();
  if(syncAgain){ syncAgain = false; scheduleSync(300); }
}
function paintNet(){ const n = app.querySelector('.net'); if(n){ n.className = 'net net-'+S.net; n.title = NETT[S.net]; } }

function renderKeep(){
  const ae = document.activeElement;
  if(ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.tagName === 'SELECT')) return;
  if(S.sheet && S.sheet.type !== 'tracker') return;
  render(true);
}
function afterRender(){

const spHints = () => ({work: S.settings.spKw ? S.settings.spKw.work : SP_DEF.work, life: S.settings.spKw ? S.settings.spKw.life : SP_DEF.life, ex: S.settings.spEx || []});
async function aiRefine(items){
  try{
    const goals = AG().filter(g => !g.done).map(g => ({id:g.id, level:g.level, t:g.t}));
    const res = await api('/ai/parse', {method:'POST', body:{items: items.map(i => ({kind:i.kind, text:i.text, level:i.level})), goals, hints: spHints()}});
    let changed = false;
    (res.items || []).forEach((r, i) => {
      const it = items[i]; if(!r || !it) return;
      if(it.kind === 'task'){
        const t = find(it.id); if(!t || t.manual) return;
        if(!t.qfix){ if(typeof r.important === 'boolean') t.imp = r.important; t.urg = r.urgent ? true : null; }
        if(r.date && !t.date) t.date = r.date;
        if(r.time) t.time = r.time;
        if(r.goal_id && goalById(r.goal_id)){ t.gid = r.goal_id; if(!t.qfix) t.imp = true; }
        if(!t.sp && (r.sphere === 'work' || r.sphere === 'life')) t.sp = r.sphere;
        t.ai = 1; changed = true;
      } else {
        const g = goalById(it.id); if(!g || g.manual) return;
        const p = goalById(r.parent_id);
        if(p && LV[p.level].ord < LV[g.level].ord){ g.parent = p.id; changed = true; }
      }
    });
    if(changed) renderKeep();
  } catch(e){ /* без ИИ остаются правила */ }
}
async function aiSteps(m, g){
  try{
    const parent = goalById(g.parent);
    const tasks = S.tasks.filter(t => t.gid === g.id && !t.done).map(t => t.t).slice(0, 8);
    const r = await api('/ai/steps', {method:'POST', body:{goal:{t:g.t, p:gp(g)}, parent: parent ? {t:parent.t} : null, tasks}});
    if(r.steps && r.steps.length){ m.sugg = r.steps; renderKeep(); }
  } catch(e){}
}
function compressImage(file){
  return new Promise((ok, fail) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 720, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', 0.75));
    };
    img.onerror = fail; img.src = url;
  });
}

function dedupeTracker(){
  const seen = new Map(), drop = new Set();
  for(const t of S.tasks.slice().sort((a,b) => String(a.id).localeCompare(String(b.id)))){
    if(!t.src) continue;
    if(seen.has(t.src)) drop.add(t.id); else seen.set(t.src, t.id);
  }
  if(!drop.size) return false;
  S.tasks = S.tasks.filter(t => !drop.has(t.id));
  const out = [];
  S.chat.forEach((m, i) => {
    if(m.task && drop.has(m.task)) return;
    if(m.text && /^Из трекера пришло/.test(m.text)){
      const next = S.chat.slice(i+1).filter(x => x.from === 'bot' && x.task);
      const firstNext = S.chat[i+1];
      if(firstNext && firstNext.task && drop.has(firstNext.task) && !(S.chat[i+2] && S.chat[i+2].task && !drop.has(S.chat[i+2].task))) return;
    }
    out.push(m);
  });
  S.chat = out;
  return true;
}

  loadLocal(); resetSnap();
  alarmKey().then(k => { S.alarmKey = k; if(S.sheet) render(true); });
  S.net = 'sync';
  render();
  sync().then(() => { if(S.settings.trOn) syncTracker(false); });
  setInterval(() => { if(document.visibilityState === 'visible') sync(); }, 30000);
  setInterval(() => syncTracker(false), 5*60*1000);
  document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible'){ sync(); } });
  window.addEventListener('online', () => sync());
}

// ===== клавиатура iPhone: держим приложение ровно в видимой области =====
(function(){
  const vv = window.visualViewport; if(!vv) return;
  let base = vv.height;
  function fit(){
    if(window.innerWidth > 500) return;
    const h = Math.round(vv.height);
    const de = document.documentElement;
    const ae = document.activeElement;
    const typing = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA') && ae.type !== 'date' && ae.type !== 'time';
    const kb = typing && base - h > 120;
    app.classList.toggle('kb', kb);
    // iPhone-приложение с экрана «Домой» сообщает высоту экрана без строки статуса — берём реальную высоту экрана
    const full = window.innerHeight;
    de.style.setProperty('--appH', (kb ? h : full)+'px');
    de.style.setProperty('--appTop', kb ? Math.round(vv.offsetTop)+'px' : '0px');
    if(!kb) window.scrollTo(0,0);
    if(!kb) base = Math.max(base, h);
    if(kb && ae.id === 'ci') chatBottom();
    else if(kb && ae.closest && ae.closest('.sheet')){ const sh = ae.closest('.sheet'); const r = ae.getBoundingClientRect(), rs = sh.getBoundingClientRect(); if(r.top < rs.top + 40 || r.bottom > rs.bottom - 20) sh.scrollTop += r.top - rs.top - 60; }
  }
  vv.addEventListener('resize', fit);
  window.addEventListener('resize', () => setTimeout(fit, 50));
  setTimeout(fit, 300);
  vv.addEventListener('scroll', fit);
  document.addEventListener('focusin', () => setTimeout(fit, 50));
  document.addEventListener('focusout', () => setTimeout(fit, 120));
  window.addEventListener('orientationchange', () => setTimeout(() => { base = vv.height; fit(); }, 400));
  fit();
})();
if(navigator.standalone && window.innerWidth <= 500) document.documentElement.classList.add('sa');
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
// автообновление: при открытии приложения проверяем, не вышла ли новая версия, и сразу подтягиваем её
const APP_V = 'v30';
async function checkUpdate(){
  try{
    const r = await fetch('./?u='+Date.now(), {cache:'no-store'}); const txt = await r.text();
    const m = txt.match(/const APP_V = '(v\d+)'/);
    if(m && m[1] !== APP_V && sessionStorage.getItem('zd_upd') !== m[1]){
      sessionStorage.setItem('zd_upd', m[1]);
      const regs = navigator.serviceWorker ? await navigator.serviceWorker.getRegistrations() : [];
      await Promise.all(regs.map(x => x.update().catch(() => {})));
      if(window.caches){ const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); }
      location.reload();
    }
  }catch(e){}
}
setTimeout(checkUpdate, 1500);
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') checkUpdate(); });
if(AUTH.pass && AUTH.url) start(); else loginView();
